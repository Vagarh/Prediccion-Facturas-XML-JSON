[pytest]
# Pytest configuration for API Testing Suite

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated, mocked dependencies)
    integration: Integration tests (slower, real dependencies)
    performance: Performance and load tests (slowest)
    security: Security and input validation tests
    regression: Model regression tests
    docker: Docker container tests
    property: Property-based tests (hypothesis)

# Coverage configuration
addopts =
    --strict-markers
    --verbose
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=80
    -ra

# Test paths
testpaths = tests

# Hypothesis configuration
hypothesis_profile = ci

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning

# Timeout for tests (5 minutes total)
timeout = 300

# Parallel execution (use with pytest-xdist)
# Run with: pytest -n auto
